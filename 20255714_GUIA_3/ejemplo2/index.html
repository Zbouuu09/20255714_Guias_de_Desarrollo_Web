<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compañía Miau</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <input type="checkbox" name="checkMenu" id="checkMenu">

    <label for="checkMenu" class="labelBotonMenu" aria-label="Abrir o cerrar el menú">
        <i class="fa fa-bars" id="btnMostrar" title="Abrir menú">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 5h18v3H3zm0 6h18v3H3zm0 6h18v3H3z" />
            </svg>
        </i>
        <i class="fa fa-times" id="btnOcultar" title="Cerrar menú">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m5 3 7 7 7-7 2 2-7 7 7 7-2 2-7-7-7 7-2-2 7-7-7-7z" />
            </svg>
        </i>
    </label>

    <aside class="sidebar">
        <header>
            <div class="logo">
                <img src="images/logo.png" alt="Logo de Compañía Miau">
            </div>
            <div class="titulo">Compañía Miau</div>
        </header>

        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="#"><i class="fa fa-home"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="m12 2 11 9-2 2-2-1.7V22h-5v-7h-4v7H5V11.3L3 13l-2-2z" />
                            </svg></i>Inicio</a></li>
                <li><a href="#"><i class="fa fa-shopping-bag"><svg viewBox="0 0 24 24" aria-hidden="true"
                                focusable="false">
                                <path
                                    d="M7 7V6a5 5 0 0 1 10 0v1h4l1 15H2L3 7zm2 0h6V6a3 3 0 0 0-6 0zm-2 3v3h2v-3zm8 0v3h2v-3z" />
                            </svg></i>Productos</a></li>
                <li><a href="#"><i class="fa fa-calendar"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path
                                    d="M5 1h2v3h10V1h2v3h3v19H2V4h3zm-1 9v11h16V10zm2 2h3v3H6zm5 0h3v3h-3zm5 0h3v3h-3zM6 17h3v3H6zm5 0h3v3h-3z" />
                            </svg></i>Actividades</a></li>
                <li><a href="#"><i class="fa fa-link"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="m9 15 6-6m-8 2-3 3a4 4 0 0 0 6 6l3-3m-2-10 3-3a4 4 0 0 1 6 6l-3 3" fill="none"
                                    stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                            </svg></i>Enlaces</a></li>
                <li><a href="#"><i class="fa fa-cog"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path
                                    d="m10 1 4 0 .6 3 2 .8 2.6-1.6 2.8 2.8-1.6 2.6.8 2L24 11v4l-3 .6-.8 2 1.6 2.6-2.8 2.8-2.6-1.6-2 .8-.6 3h-4l-.6-3-2-.8-2.6 1.6-2.8-2.8 1.6-2.6-.8-2L0 15v-4l3-.6.8-2L2.2 5.8 5 3l2.6 1.6 2-.8zM12 8a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"
                                    transform="translate(1 -.8) scale(.92)" fill-rule="evenodd" />
                            </svg></i>Configuración</a></li>
                <li><a href="#"><i class="fa fa-question-circle-o"><svg viewBox="0 0 24 24" aria-hidden="true"
                                focusable="false">
                                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
                                <path d="M8.5 8.5a3.5 3.5 0 0 1 7 0c0 2.5-3.5 2.5-3.5 5" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                                <circle cx="12" cy="17" r="1.2" />
                            </svg></i>Acerca de</a></li>
                <li><a href="#"><i class="fa fa-envelope-o"><svg viewBox="0 0 24 24" aria-hidden="true"
                                focusable="false">
                                <path d="M2 5h20v14H2zm0 0 10 8L22 5" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linejoin="round" />
                            </svg></i>Contacto</a></li>
            </ul>
        </nav>
    </aside>

    <main class="container"></main>
</body>

</html>
